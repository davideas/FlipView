plugins {
    id 'com.android.library'
}

android {
    compileSdk targetSdk
    namespace = 'eu.davidea.flipview'

    defaultConfig {
        minSdk = rootProject.ext.minSdk
        targetSdk = rootProject.ext.targetSdk
        versionCode libraryCode
        versionName libraryVersion + libraryDate
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        abortOnError = false
    }
}

dependencies {
    //See main build.gradle for values & versions
    compileOnly androidx.appCompat
    compileOnly androidx.annotation
}

// Local Publishing: gradlew :flipview:publishToMavenLocal
// Central Publishing: gradlew :flipview:publishToMavenCentral
apply from: '../publish.gradle'
